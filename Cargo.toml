[package]
name = "ccm-convergence-rate"
version = "1.2.0"
edition = "2021"
rust-version = "1.98"
description = "A quantitative convergence law for the CCM Zeta Spectral Triple, with defined rigor levels per component (arXiv:2511.22755)"
authors = ["Ronnie Andrews, Jr. <5178942+TeamXceleratorDev@users.noreply.github.com>"]
license-file = "LICENSE"

[features]
default = []
# High-precision tier via rug (MPFR/GMP). Required for meaningful results.
# Build: cargo build --release --features arb --locked
# Requires FLINT 3+: build-essential m4 libgmp-dev libmpfr-dev libmpc-dev libflint-dev pkg-config
arb = ["hp", "xc-spectral/arb"]
hp = ["xc-spectral/hp", "xc-zeta/hp", "xc-numerics/hp", "dep:rug"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rug = { version = "1.30", optional = true, default-features = false, features = ["float", "integer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Xcelerator Toolkit: immutable revision recorded in Cargo.toml and Cargo.lock.
xc-cache    = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "97e9445ebbf1844a7d60b5141d3fb737fe9f00dd" }
xc-spectral = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "97e9445ebbf1844a7d60b5141d3fb737fe9f00dd" }
xc-zeta     = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "97e9445ebbf1844a7d60b5141d3fb737fe9f00dd" }
xc-numerics = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "97e9445ebbf1844a7d60b5141d3fb737fe9f00dd" }

xc-core = { git = "https://github.com/TeamXcelerator/xcelerator-toolkit", rev = "97e9445ebbf1844a7d60b5141d3fb737fe9f00dd" }

[profile.release]
opt-level = 3
lto = "thin"
